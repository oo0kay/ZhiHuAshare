[project]
name = "zhihu-ashare-learner"
version = "0.1.0"
description = "Zhihu A-Share Beginner Learner Skill for GitHub Actions + Gemini API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "markdownify>=0.11.0",
    "markdown>=3.6",
    "pillow>=10.2.0",
    "google-genai>=0.1.1",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

